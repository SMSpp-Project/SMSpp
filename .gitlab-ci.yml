# The CHANGELOG of the module, held to the format and, on a merge request, to
# the commits of the branch [see ci/changelog.yml of the umbrella], and the
# code and the configurations that a merge request changes, held to the
# style of SMS++ [see ci/style.yml of the umbrella].
include:
  - project: smspp/smspp-project
    ref: develop
    file: /ci/changelog.yml
  - project: smspp/smspp-project
    ref: develop
    file: /ci/style.yml

default:
  image: registry.gitlab.com/smspp/smspp-project

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    - cmake --build build
  artifacts:
    paths:
      - build
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt

# The makefiles, which have to keep building what CMake builds: they need the
# extlib/ of the umbrella, and FastFlow, which CMake would fetch, hence the
# umbrella is cloned with this commit of the core in it [see ci/makefile of
# the umbrella]. The second build is with clang++ and the C++20 module, and
# runs the test that imports it.
makefiles:
  stage: build
  script:
    - git clone --quiet --depth 1 --branch develop
                https://gitlab.com/smspp/smspp-project.git /tmp/umbrella
    - rm -rf /tmp/umbrella/SMS++ && cp -a "$CI_PROJECT_DIR" /tmp/umbrella/SMS++
    - git clone --quiet --depth 1 https://github.com/fastflow/fastflow.git
                /tmp/fastflow
    - cd /tmp/umbrella
    - make -f ci/makefile -j$(nproc) MODULE=SMS++ FastFlow_ROOT=/tmp/fastflow
    - make -f ci/makefile clean-all
    - make -f ci/makefile -j$(nproc) MODULE=SMS++ CC=clang++ SMSppMOD=1
           FastFlow_ROOT=/tmp/fastflow
    - cd SMS++/test
    - make -f makefile-Module -j$(nproc) CC=clang++
           FastFlow_ROOT=/tmp/fastflow
    - ./Module_test
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - lib/makefile*
      - src/*
      - test/*
      - .gitlab-ci.yml

test:
  stage: test
  script:
    - ctest -V -C Release --test-dir build
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt

deploy:
  stage: deploy
  script:
    - cd build && cpack -G "TGZ;ZIP;TBZ2"
  artifacts:
    paths:
      - build/*.tar.gz
      - build/*.tar.bz2
      - build/*.zip
  only:
    - tags
