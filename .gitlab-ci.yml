default:
  image: registry.gitlab.com/smspp/smspp

stages:
  - build
  - test
  - pages

build:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
  artifacts:
    when: on_success
    - build
  only:
    changes:
      - include/*
      - src/*
      - test/*
      - CMakeLists.txt

test:
  stage: test
  script:
    - cmake --build build --target test

pages:
  image: alpine
  before_script:
    - apk update
    - apk add doxygen
  ### Uncomment the following line if you use graphviz dot graphs
  ##- apk add ttf-freefont graphviz
  script:
    - doxygen doxygen/Doxyfile
    - mv doc/html/ public/
  artifacts:
    paths:
      - public
  only:
    - master
