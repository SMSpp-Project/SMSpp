default:
  image: registry.gitlab.com/smspp/smspp

before_script:
  - apt-get update
  - apt-get install -y doxygen git wget build-essential
  - wget https://github.com/Kitware/CMake/releases/download/v3.19.0/cmake-3.19.0-Linux-x86_64.sh
  - sh cmake-3.19.0-Linux-x86_64.sh --skip-license --prefix=/usr/local

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
  artifacts:
    paths:
      - build
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - CMakeLists.txt

test:
  stage: test
  script:
    - cmake --build build --target test
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - CMakeLists.txt

deploy:
  stage: deploy
  script:
    - cd build && cpack -G "TGZ;ZIP;TBZ2"
  artifacts:
    paths:
      - build/*.tar.gz
      - build/*.tar.bz2
      - build/*.zip
  only:
    - tags
